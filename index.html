<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pywright</title>
<meta name="description" content="pywright is being built.">
<meta name="theme-color" content="#0b0d14">
<link rel="icon" href="pywright.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d14;
    --fg: #eef1f8;
    --muted: #9aa3b8;
    --line: rgba(255,255,255,.09);
    --card: rgba(255,255,255,.04);
    --mint: #71e3c0;
    --violet: #8b7bff;
    --amber: #ffc46b;
  }
  * { box-sizing: border-box; margin: 0; }
  html { color-scheme: dark; }
  body {
    height: 100vh;
    height: 100dvh;
    background: var(--bg);
    color: var(--fg);
    font-family: "Inter", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Background glow */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
  .blob {
    position: absolute; border-radius: 50%; filter: blur(110px); opacity: .5;
    animation: drift 22s ease-in-out infinite alternate;
  }
  .b1 { width: 560px; height: 560px; background: var(--violet); top: -180px; left: -120px; }
  .b2 { width: 520px; height: 520px; background: var(--mint); bottom: -220px; right: -140px; opacity: .32; animation-delay: -8s; }
  .b3 { width: 360px; height: 360px; background: #ff7ab8; top: 40%; left: 55%; opacity: .16; animation-delay: -14s; }
  @keyframes drift { to { transform: translate(60px, 40px) scale(1.12); } }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse at 50% 35%, #000 10%, transparent 70%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 35%, #000 10%, transparent 70%);
    opacity: .55;
  }

  /* Layout */
  header, main, footer { width: 100%; max-width: 1080px; margin: 0 auto; padding-inline: 24px; }
  header { display: flex; align-items: center; justify-content: space-between; padding-block: clamp(14px, 3.5vh, 28px); }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.02em; font-size: 1.1rem; }
  .logo img { width: 30px; height: 30px; }
  .logo span { color: var(--muted); font-weight: 500; }

  main { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; padding-block: clamp(8px, 3vh, 40px); }
  .hero { text-align: center; max-width: 760px; margin: 0 auto; }
  h1 {
    font-size: clamp(2.2rem, min(8vw, 9vh), 5.2rem);
    line-height: 1.02; letter-spacing: -.045em; font-weight: 800;
  }
  .grad {
    background: linear-gradient(100deg, var(--mint), var(--violet) 55%, #ff7ab8);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    background-size: 200% auto; animation: shine 8s linear infinite;
  }
  @keyframes shine { to { background-position: 200% center; } }

  /* Terminal */
  .term {
    margin: clamp(20px, 6vh, 52px) auto 0; max-width: 640px; text-align: left;
    background: rgba(12,14,22,.75); backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 16px;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.02) inset;
    overflow: hidden;
  }
  .bar { display: flex; align-items: center; gap: 7px; padding: 13px 16px; border-bottom: 1px solid var(--line); }
  .bar i { width: 11px; height: 11px; border-radius: 50%; background: #2b3042; }
  .bar i:nth-child(1) { background: #ff6b6b; } .bar i:nth-child(2) { background: #ffc46b; } .bar i:nth-child(3) { background: #71e3c0; }
  .bar b { margin-left: auto; margin-right: auto; font: 500 .75rem "JetBrains Mono", monospace; color: var(--muted); transform: translateX(-24px); }
  .code { padding: 22px 24px 26px; font: 400 .92rem/1.9 "JetBrains Mono", monospace; color: #c9d1e6; }
  .code .c { color: #5f6985; }
  .code .p { color: var(--mint); }
  .code .w { color: var(--amber); }
  .caret { display: inline-block; width: 9px; height: 1.05em; background: var(--mint); vertical-align: -3px; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* Progress */
  .progress { margin: clamp(20px, 6vh, 56px) auto 0; max-width: 640px; }
  .progress-head { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-bottom: 12px; }
  .progress-head b { color: var(--fg); font-weight: 600; }
  .track { height: 8px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); overflow: hidden; }
  .fill {
    height: 100%; width: 12%; border-radius: inherit;
    background: linear-gradient(90deg, var(--mint), var(--violet));
    background-size: 200% 100%; animation: flow 3s linear infinite;
    box-shadow: 0 0 20px rgba(113,227,192,.5);
  }
  @keyframes flow { to { background-position: -200% 0; } }

  footer { padding-block: clamp(12px, 3.5vh, 36px); display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: .85rem; border-top: 1px solid var(--line); }

  @media (max-width: 760px) {
    .code { font-size: .8rem; padding: 18px; }
    header { padding-block: 20px; }
    .bar b { display: none; }
  }
  @media (max-height: 620px) {
    .code { padding-block: 12px; line-height: 1.6; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
    <div class="grid"></div>
  </div>

  <header>
    <div class="logo">
      <img src="pywright.svg" alt="" width="30" height="30">
      pywright<span>.io</span>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>Something is <span class="grad">being built</span>.</h1>

      <div class="term" role="img" aria-label="Terminal showing pywright status: in progress">
        <div class="bar"><i></i><i></i><i></i><b>~/pywright</b></div>
        <div class="code">
          <div><span class="p">$</span> pywright --status</div>
          <div><span class="c"># checking progress...</span></div>
          <div><span class="w">⚠</span> status: <span class="w">in progress</span></div>
          <div><span class="w">⚠</span> phase: <span class="w">laying the foundations</span></div>
          <div><span class="p">$</span> <span class="caret"></span></div>
        </div>
      </div>

      <div class="progress">
        <div class="progress-head"><span>Build progress</span><b>Early days</b></div>
        <div class="track" role="progressbar" aria-valuenow="12" aria-valuemin="0" aria-valuemax="100" aria-label="Build progress"><div class="fill"></div></div>
      </div>
    </section>
  </main>

  <footer>
    <span>© <span id="y">2026</span> pywright.io</span>
  </footer>

  <script>document.getElementById("y").textContent = new Date().getFullYear();</script>
</body>
</html>
